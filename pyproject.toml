[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reporivet"
dynamic = ["version"]
description = "Repository-native harness initializer for long-running agent-driven software development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "gkrtjd99 and Reporivet contributors"}]
keywords = ["agents", "codex", "harness", "execplan", "repository"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gkrtjd99/Reporivet"
Repository = "https://github.com/gkrtjd99/Reporivet.git"
Issues = "https://github.com/gkrtjd99/Reporivet/issues"

[project.scripts]
reporivet = "reporivet.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "reporivet.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
reporivet = [
  "assets/project/document-first/root/*.tmpl",
  "assets/project/document-first/docs/*.tmpl",
  "assets/project/document-first/docs/*/*.tmpl",
  "assets/project/document-first/claude/*.tmpl",
  "assets/user-scoped/reporivet-setup/SKILL.md",
]
